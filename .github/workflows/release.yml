name: Release

# Ausgeloest von einem Tag, von Hand ueber "Run workflow" auch ohne einen.

# Ein Tag wie v1.2.0 loest alles aus: bauen, schnueren, veroeffentlichen und das AUR-Paket
# nachziehen. Die Version im Programm kommt aus dem Tag, damit sie nicht zweimal gepflegt wird.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, zum Ausprobieren ohne Tag"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Bauen und schnueren
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Werkzeuge
        run: |
          pacman -Syu --noconfirm --needed git rust clang llvm pkgconf cmake python perl \
            imagemagick zstd fontconfig libxkbcommon nss nspr alsa-lib
          rustc --version

      - uses: actions/checkout@v4

      - name: CEF aus dem Zwischenlager
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-${{ hashFiles('Cargo.lock') }}
          restore-keys: cef-

      - name: Version aus dem Tag
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Die Version '$version' sieht nicht nach X.Y.Z aus." >&2; exit 1 ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Version einbauen
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="${{ steps.version.outputs.version }}"
          # Die erste Version in Cargo.toml ist die des Arbeitsbereichs, die alle Kisten erben.
          sed -i "0,/^version = \".*\"$/s//version = \"$version\"/" Cargo.toml
          # Die Sperrdatei traegt die Version jedes Mitglieds, sie zieht mit.
          cargo update --workspace
          grep -m1 '^version' Cargo.toml

      - name: Bauen und schnueren
        id: package
        run: |
          scripts/package.sh --version "${{ steps.version.outputs.version }}"
          archive="target/release-package/atoll-${{ steps.version.outputs.version }}-x86_64.tar.zst"
          echo "sha256=$(sha256sum "$archive" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: atoll-linux-x86_64
          path: target/release-package/*
          retention-days: 7

  release:
    name: Veroeffentlichen
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atoll-linux-x86_64
          path: package

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          files: package/*
          generate_release_notes: true
          body: |
            Atoll ${{ needs.build.outputs.version }} fuer Linux (x86_64).

            Auf Arch und abgeleiteten Systemen:

            ```sh
            paru -S atoll-bin   # oder yay -S atoll-bin
            ```

            Sonst das Archiv entpacken, `opt/Atoll` nach `/opt/Atoll` legen und den Starter
            aus `usr/bin/atoll` nach `/usr/bin` kopieren.

            Dieser Build traegt die freien Codecs von CEF. Fuer H.264 und AAC braucht es einen
            eigenen CEF-Build, siehe `scripts/build-cef.sh` in den Quellen.

  arch-repo:
    name: pacman-Repo nachziehen
    needs: [build, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    container:
      image: archlinux:base-devel
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
      VERSION: ${{ needs.build.outputs.version }}
      # Der Ort, der in der pacman.conf steht und sich nie aendert.
      REPO_TAG: arch-repo
    steps:
      - name: Werkzeuge
        run: pacman -Syu --noconfirm --needed git github-cli gnupg

      - uses: actions/checkout@v4

      - name: Ohne Schluessel nichts tun
        id: guard
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "Kein REPO_GPG_KEY hinterlegt, das pacman-Repo bleibt unberuehrt."
            echo "skip=yes" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.skip != 'yes'
        with:
          name: atoll-linux-x86_64
          path: paket

      - name: Paket bauen und signieren
        if: steps.guard.outputs.skip != 'yes'
        run: |
          git config --global --add safe.directory '*'
          # makepkg laeuft nicht als root, also bekommt es einen eigenen Benutzer.
          useradd -m packager
          install -dm755 /tmp/repo
          sed "s/@VERSION@/$VERSION/g" packaging/repo/PKGBUILD.in >/tmp/repo/PKGBUILD
          cp "paket/atoll-$VERSION-x86_64.tar.zst" /tmp/repo/
          chown -R packager /tmp/repo
          # Der Schluessel geht ueber eine Datei, damit er in keiner Befehlszeile steht.
          printf '%s\n' "$GPG_KEY" >/tmp/key.asc
          chown packager /tmp/key.asc
          su - packager -c 'gpg --batch --quiet --import /tmp/key.asc'
          shred -u /tmp/key.asc
          key="$(su - packager -c 'gpg --list-secret-keys --with-colons' |
            awk -F: '/^sec:/ {print $5; exit}')"
          [ -n "$key" ] || { echo 'Im Schluessel steckt kein geheimer Teil.' >&2; exit 1; }
          echo "Signiert wird mit $key."
          su - packager -c "cd /tmp/repo && makepkg --nodeps --noconfirm --sign --key $key"
          su - packager -c "cd /tmp/repo && repo-add --sign --key $key atoll.db.tar.zst atoll-*.pkg.tar.zst"
          # Die Datenbank liegt als Verweis daneben, ein Release traegt aber nur echte Dateien.
          cd /tmp/repo
          for name in db files; do
            cp -L --remove-destination "atoll.$name.tar.zst" "atoll.$name"
            cp -L --remove-destination "atoll.$name.tar.zst.sig" "atoll.$name.sig"
          done
          su - packager -c "gpg --armor --export $key" >atoll-repo.gpg
          ls -l /tmp/repo

      - name: Ins Repo-Release legen
        if: steps.guard.outputs.skip != 'yes'
        run: |
          cd /tmp/repo
          gh release view "$REPO_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$REPO_TAG" --repo "$GITHUB_REPOSITORY" \
              --title 'pacman-Repository' \
              --notes 'Das Paketverzeichnis fuer Arch. Die Dateien hier werden mit jeder Version ersetzt, die Adresse bleibt.'
          # Was von der vorigen Version liegt, geht: die Datenbank kennt nur die neue.
          gh release view "$REPO_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
            while read -r asset; do
              gh release delete-asset "$REPO_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done
          gh release upload "$REPO_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            atoll-*.pkg.tar.zst atoll-*.pkg.tar.zst.sig \
            atoll.db atoll.db.sig atoll.db.tar.zst atoll.db.tar.zst.sig \
            atoll.files atoll.files.sig atoll.files.tar.zst atoll.files.tar.zst.sig \
            atoll-repo.gpg

  aur:
    name: AUR nachziehen
    needs: [build, release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    container:
      image: archlinux:base-devel
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      VERSION: ${{ needs.build.outputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - name: Werkzeuge
        run: pacman -Syu --noconfirm --needed git openssh

      - uses: actions/checkout@v4

      - name: Ohne Schluessel nichts tun
        id: guard
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "Kein AUR_SSH_KEY hinterlegt, das AUR bleibt unberuehrt."
            echo "skip=yes" >>"$GITHUB_OUTPUT"
          fi

      - name: Schluessel einrichten
        if: steps.guard.outputs.skip != 'yes'
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" >~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >>~/.ssh/known_hosts 2>/dev/null
          cat >~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF

      - name: PKGBUILD schreiben und schieben
        if: steps.guard.outputs.skip != 'yes'
        run: |
          git config --global --add safe.directory '*'
          # makepkg laeuft nicht als root, also bekommt es einen eigenen Benutzer.
          useradd -m packager
          git clone ssh://aur@aur.archlinux.org/atoll-bin.git /tmp/aur
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$SHA256/g" \
            packaging/aur/PKGBUILD.in >/tmp/aur/PKGBUILD
          chown -R packager /tmp/aur
          su packager -c 'cd /tmp/aur && makepkg --printsrcinfo >.SRCINFO'
          cd /tmp/aur
          git config user.name 'Atoll CI'
          git config user.email 'thedasdarki@gmail.com'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo 'Nichts zu schieben.'
          else
            git commit -q -m "atoll-bin $VERSION"
            git push origin HEAD:master
          fi
