services:
  atoll-sync:
    build:
      context: ../..
      dockerfile: deploy/sync-server/Dockerfile
    restart: unless-stopped
    environment:
      ATOLL_SYNC_DATABASE_URL: postgres://atoll:${POSTGRES_PASSWORD:-atoll}@postgres:5432/atoll_sync
      ATOLL_SYNC_ONYX_URL: ${ATOLL_SYNC_ONYX_URL}
      ATOLL_SYNC_CLIENT_ID: ${ATOLL_SYNC_CLIENT_ID}
      ATOLL_SYNC_TOMBSTONE_DAYS: ${ATOLL_SYNC_TOMBSTONE_DAYS:-180}
      RUST_LOG: ${RUST_LOG:-atoll_sync_server=info}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atoll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atoll}
      POSTGRES_DB: atoll_sync
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atoll -d atoll_sync"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
