[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
atoll-core = { path = "crates/atoll-core" }
atoll-storage = { path = "crates/atoll-storage" }
atoll-transfer = { path = "crates/atoll-transfer" }
atoll-engine = { path = "crates/atoll-engine" }

ash = "0.38"
cef = { version = "152.3", default-features = false }
directories = "6"
getrandom = "0.3"
anyhow = "1"
arboard = { version = "3.6", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
pollster = "1"
rfd = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
    "unstable-winit-030",
] }
slint-build = "1.18"
thiserror = "2"
tracing = "0.1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
wgpu = "30"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
