[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
atoll-core = { path = "crates/atoll-core" }
atoll-storage = { path = "crates/atoll-storage" }
atoll-transfer = { path = "crates/atoll-transfer" }
atoll-engine = { path = "crates/atoll-engine" }
atoll-adblock = { path = "crates/atoll-adblock" }
atoll-consent = { path = "crates/atoll-consent" }
atoll-onepassword = { path = "crates/atoll-onepassword" }
atoll-video = { path = "crates/atoll-video" }
atoll-plugin = { path = "crates/atoll-plugin" }
atoll-i18n = { path = "crates/atoll-i18n" }
atoll-net = { path = "crates/atoll-net" }
atoll-socks = { path = "crates/atoll-socks" }
atoll-vpn = { path = "crates/atoll-vpn" }
atoll-tor = { path = "crates/atoll-tor" }
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }

arti-client = "0.47"
tor-rtcompat = "0.47"
ash = "0.38"
boringtun = "0.7"
cef = { version = "152.3", default-features = false }
directories = "6"
getrandom = "0.3"
anyhow = "1"
arboard = { version = "3.6", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
mlua = { version = "0.12", features = ["luau", "vendored", "serialize"] }
pollster = "1"
regex = "1"
rfd = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
    "unstable-winit-030",
] }
slint-build = "1.18"
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "proto-dns",
    "socket-tcp",
    "socket-dns",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
thiserror = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tracing = "0.1"
ureq = { version = "3.4", features = ["socks-proxy"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
wgpu = "30"
zip = { version = "8", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
